<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>ПРОВЕРКА ЛИЧНОСТИ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container login">
        <h1>Для допуска ответьте:</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('login') }}">
            <input type="password" name="password" placeholder="Кодовое слово какое??" required>
            <button type="submit">Пустите</button>
        </form>
        <img src="{{ url_for('static', filename='images/mmm.jpg') }}" class="screenshots">
    </div>
</body>
</html>
